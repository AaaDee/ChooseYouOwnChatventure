name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:latest
                ports:
                    - 27017:27017
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci

            - name: Start Docker services
              run: docker compose -f docker-compose-ci.yml up -d
              env:
                  MONGODB_URI: mongodb://host.docker.internal:27017/test

            - name: Stream Docker Logs
              run: docker compose -f docker-compose-ci.yml logs -t

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Print logs
              run: docker compose -f docker-compose-ci.yml logs -t

            - name: Wait for Frontend
              run: npx wait-on http-get://127.0.0.1:80 --timeout 60000 -v

            - name: Run Playwright tests
              run: npx playwright test

            - name: Dump Docker Logs on Failure
              if: failure()
              run: docker compose -f docker-compose-dev.yml logs --tail="all" -t

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
